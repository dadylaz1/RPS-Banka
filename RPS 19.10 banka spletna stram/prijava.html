<!DOCTYPE html>
<html lang="sl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Prijava | Benko banka</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Public+Sans:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header class="glava sticky-top bg-white">
    <nav class="navbar py-3">
        <div class="container">
            <a class="logotip" href="index.html">Benko<span class="logotip-pika">.</span></a>
            <a class="btn gumb-obroba rounded-0" href="regist.html">Odpri račun</a>
        </div>
    </nav>
</header>
<main class="obmocje-racuna py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-7 col-lg-5">
                <section class="card kartica-nastavitev rounded-0 p-4 p-md-5">
                    <h1 class="registracija-podnaslov mb-2">Dobrodošli nazaj.</h1>
                    <p class="text-secondary mb-4">Prijavite se v svojo spletno banko.</p>
                    <div class="alert d-none" id="sporocilo-prijave" role="alert"></div>
                    <form id="obrazec-prijave">
                        <div class="mb-3">
                            <label class="form-label" for="prijava-eposta">E-poštni naslov</label>
                            <input class="form-control rounded-0" id="prijava-eposta" name="eposta" type="email" autocomplete="email" required>
                        </div>
                        <div class="mb-4">
                            <label class="form-label" for="prijava-geslo">Geslo</label>
                            <input class="form-control rounded-0" id="prijava-geslo" name="geslo" type="password" autocomplete="current-password" required>
                        </div>
                        <button class="btn btn-lg gumb-zlat rounded-0 w-100" type="submit">Prijava</button>
                    </form>
                    <p class="mt-4 mb-0">Še nimate računa? <a class="registracija-povezava" href="regist.html">Ustvarite ga</a></p>
                </section>
            </div>
        </div>
    </div>
</main>
<footer class="noga py-4">
    <div class="container"><a class="logotip" href="index.html">Benko<span class="logotip-pika">.</span></a></div>
</footer>
<script src="script.js"></script>
<script src="racun.js"></script>
</body>
</html>
