<!DOCTYPE html>
<html lang="sl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Nastavitve računa | Benko banka</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Public+Sans:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header class="glava sticky-top bg-white">
    <nav class="navbar py-3">
        <div class="container">
            <a class="logotip" href="index.html">Benko<span class="logotip-pika">.</span></a>
            <div class="d-flex gap-3">
                <a class="btn gumb-obroba rounded-0" href="konto.html">Moj račun</a>
                <button class="btn gumb-moder rounded-0" id="odjava-gumb" type="button">Odjava</button>
            </div>
        </div>
    </nav>
</header>
<main class="obmocje-racuna py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <section class="card kartica-nastavitev rounded-0 p-4 p-md-5">
                    <h1 class="registracija-podnaslov">Nastavitve računa</h1>
                    <p class="text-secondary mb-4">Posodobite osebne podatke ali spremenite geslo.</p>
                    <div class="alert d-none" id="sporocilo-nastavitev" role="alert"></div>
                    <form id="obrazec-nastavitev">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label" for="nastavitev-ime">Ime</label>
                                <input class="form-control rounded-0" id="nastavitev-ime" name="ime" autocomplete="given-name" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label" for="nastavitev-priimek">Priimek</label>
                                <input class="form-control rounded-0" id="nastavitev-priimek" name="priimek" autocomplete="family-name" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label" for="nastavitev-eposta">E-poštni naslov</label>
                                <input class="form-control rounded-0" id="nastavitev-eposta" name="eposta" type="email" autocomplete="email" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label" for="nastavitev-telefon">Telefonska številka</label>
                                <input class="form-control rounded-0" id="nastavitev-telefon" name="telefon" type="tel" autocomplete="tel">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label" for="nastavitev-rojstvo">Datum rojstva</label>
                                <input class="form-control rounded-0" id="nastavitev-rojstvo" name="datum_rojstva" type="date" required>
                            </div>
                        </div>
                        <hr class="my-4">
                        <h2 class="h5 mb-3">Sprememba gesla</h2>
                        <p class="small text-secondary">Če gesla ne želite spremeniti, ta polja pustite prazna.</p>
                        <div class="row g-3">
                            <div class="col-md-4">
                                <label class="form-label" for="staro-geslo">Trenutno geslo</label>
                                <input class="form-control rounded-0" id="staro-geslo" name="staro_geslo" type="password" autocomplete="current-password">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label" for="novo-geslo">Novo geslo</label>
                                <input class="form-control rounded-0" id="novo-geslo" name="novo_geslo" type="password" minlength="8" autocomplete="new-password">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label" for="ponovi-novo-geslo">Ponovite novo geslo</label>
                                <input class="form-control rounded-0" id="ponovi-novo-geslo" name="ponovi_novo_geslo" type="password" minlength="8" autocomplete="new-password">
                            </div>
                        </div>
                        <div class="d-flex flex-wrap gap-3 mt-4">
                            <button class="btn btn-lg gumb-zlat rounded-0" type="submit">Shrani spremembe</button>
                            <a class="btn btn-lg gumb-obroba rounded-0" href="konto.html">Prekliči</a>
                        </div>
                    </form>
                </section>
            </div>
        </div>
    </div>
</main>
<footer class="noga py-4"><div class="container"><span class="noga-pravno">© 2026 Benko banka.</span></div></footer>
<script src="script.js"></script>
<script src="racun.js"></script>
</body>
</html>
